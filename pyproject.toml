[project]
name = "indexedge"
version = "1.0.0"
description = "Self-hosted Nifty 50 / Bank Nifty trading assistant for Angel One SmartAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "duckdb>=1.0",
    "pyarrow>=15",
    "apscheduler>=3.10,<4",
    "feedparser>=6.0",
    "vaderSentiment>=3.3",
    "pyotp>=2.9",
    "keyring>=25",
    "python-dotenv>=1.0",
    "smartapi-python>=1.4",
    "logzero>=1.7",
    "websocket-client>=1.7",
    "openpyxl>=3.1",
    "yfinance>=0.2.40",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]
finbert = ["transformers>=4.40", "torch>=2.2"]
shap = ["shap>=0.45"]

[project.scripts]
indexedge = "indexedge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["indexedge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
